      Secret management is woven through 8+ extension points (mask/unmask),
      the streaming pipeline, history management, and error handling. It's
      not isolated — it's an architectural cross-cutting concern.

    5_projects_create_isolation: |
      The projects system creates clean isolation boundaries for memory,
      knowledge, secrets, and working directories. This enables multi-tenant
      use cases where different projects don't contaminate each other.

    6_progressive_compression_enables_scale: |
      The History system's Message→Topic→Bulk compression with 50/30/20 budget
      allocation enables arbitrarily long conversations — a key differentiator
      for long-running agentic tasks.

