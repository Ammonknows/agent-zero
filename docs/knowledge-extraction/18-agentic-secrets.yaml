#  δ₁₈ AGENTIC-SECRETS DIMENSION — Secrets Management
##############################################################################

dimension:
  id: "δ₁₈"
  name: "AGENTIC-SECRETS"
  priority: P1
  completeness: 1.0
  confidence: 0.82

sub_dimensions:

  σ₁₈.₁_secrets_architecture:
    description: "Placeholder pattern, hierarchy, SecretsManager"
    content:
      module: "python/helpers/secrets.py"
      placeholder_pattern: "§§secret(KEY_NAME)"
      regex: 'r"§§secret\\(([A-Za-z_][A-Za-z0-9_]*)\\)"'
      philosophy: |
        The agent never sees actual secret values. It works with §§secret(KEY)
        placeholders. Values are only unmasked at the moment of tool execution
        and immediately re-masked afterward.
      hierarchy:
        global: "usr/secrets.env — DEFAULT_SECRETS_FILE"
        project: ".a0proj/secrets.env — per-project override"
        merge: "Project secrets override global secrets"
      key_format: "Upper-case keys (alias_for_key normalizes to uppercase)"

  σ₁₈.₂_masking_pipeline:
    description: "Mask/unmask extensions and streaming filter"
    content:
      mask_points:
        util_model_call_before: "_10_mask_secrets.py — mask before utility LLM calls"
        tool_execute_after: "_10_mask_secrets.py — re-mask after tool execution"
        hist_add_before: "_10_mask_content.py — mask in history entries"
        error_format: "_10_mask_errors.py — mask in error messages"
        response_stream_chunk: "_10_mask_stream.py — mask in streaming response"
        reasoning_stream_chunk: "_10_mask_stream.py — mask in streaming reasoning"
        response_stream_end: "_10_mask_end.py — finalize stream mask"
        reasoning_stream_end: "_10_mask_end.py — finalize stream mask"
      unmask_points:
        tool_execute_before: "_10_unmask_secrets.py — unmask §§secret() to real values before tool runs"
      streaming_filter:
        class: "StreamingSecretsFilter"
        description: "Stateful chunk-by-chunk filter for streaming content"
        mechanism: |
          Maintains a buffer of pending text. For each incoming chunk:
          1. Concatenate with pending buffer
          2. Replace any full secret values with §§secret(KEY) placeholders
          3. Check if trailing text is a prefix of any known secret
          4. If so, hold it in buffer (don't flush yet)
          5. On finalize(), mask any unresolved partial with '***'
        min_trigger: "3 characters (minimum prefix length to trigger buffering)"

  σ₁₈.₃_env_file_management:
    description: "Comment preservation, parsing, intelligent merge"
    content:
      parser:
        class: "EnvLine (@dataclass)"
        types: ["pair", "comment", "blank", "other"]
        fields: ["raw", "type", "key", "value", "inline_comment"]
      features:
        - "Preserves comments when merging/updating .env files"
        - "Handles inline comments on key=value lines"
        - "Parses via dotenv.parser.parse_stream"
      merge_behavior: |
        When merging project + global secrets, comments and formatting
        from both files are preserved. New keys are appended.

  σ₁₈.₄_security_model:
    description: "Risk profile and mitigations"
    content:
      primary_risk: "LLM could potentially leak secrets through tool outputs"
      mitigations:
        - "Agent never sees raw secret values (placeholder-only interaction)"
        - "Secrets unmasked only at tool_execute_before, re-masked at tool_execute_after"
        - "StreamingSecretsFilter catches secrets in streaming output"
        - "History entries are masked before storage"
        - "Error messages are masked before display"
        - "Utility model calls are masked"
      container_isolation: "Docker container provides OS-level isolation"
      remaining_risks:
        - "Side-channel: agent could encode secret in tool args that get logged"
        - "Timing: brief window where unmaked value exists in memory"

