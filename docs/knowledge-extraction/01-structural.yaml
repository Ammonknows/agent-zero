        large_files:
          - "run_ui.py: 19,547 lines (web server)"
          - "memory_consolidation.py: ~34KB"
          - "document_query.py: ~25KB"
          - "memory.py: ~22KB"
          - "code_execution_tool.py: ~20KB"
          - "browser_agent.py: ~17KB"
          - "settings.py: large (Settings TypedDict + defaults)"

