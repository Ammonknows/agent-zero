            utilities: ["localization.py", "security.py", "login.py", "secrets.py", "task_scheduler.py"]

  σ₁.₃_file_taxonomy:
    description: "File types, naming conventions, distribution"
    content:
      python_files: 221
      naming_conventions:
        api_handlers: "snake_case, verb_noun pattern (e.g., chat_create.py, settings_get.py)"
        extensions: "Numbered prefix _NN_ for priority ordering (e.g., _10_system_prompt.py, _50_recall_memories.py)"
        tools: "snake_case descriptive (e.g., code_execution_tool.py, browser_agent.py)"
        prompts: "Dot-separated namespace (e.g., agent.system.main.md, fw.code.running.md)"
        helpers: "snake_case module name (e.g., memory_consolidation.py, task_scheduler.py)"
