    description: "Class inheritance, entity relationships"
    content:
      core_classes:
        Agent:
          file: "agent.py:356"
          inherits: null
          key_methods: ["monologue()", "prepare_prompt()", "process_tools()", "call_chat_model()"]
          constants: ["DATA_NAME_SUPERIOR", "DATA_NAME_SUBORDINATE", "DATA_NAME_CTX_WINDOW"]
        AgentContext:
          file: "agent.py:45"
          inherits: null
          pattern: "Static registry with _contexts dict"
          key_methods: ["get()", "current()", "communicate()", "_process_chain()"]
        AgentConfig:
          file: "agent.py:298"
          inherits: "@dataclass"
          fields: ["chat_model", "utility_model", "embeddings_model", "browser_model", "mcp_servers", "profile"]
        LoopData:
          file: "agent.py:326"
          inherits: null
          fields: ["iteration", "system", "user_message", "history_output", "extras_temporary", "extras_persistent", "last_response", "params_temporary", "params_persistent", "current_tool"]
      model_classes:
        ModelConfig:
          file: "models.py"
          inherits: "@dataclass"
          fields: ["type", "provider", "name", "api_base", "ctx_length", "limit_requests", "limit_input", "limit_output", "vision", "kwargs"]
        ChatGenerationResult:
          file: "models.py"
          manages: "streaming response parsing, thinking tag extraction"
        LiteLLMChatWrapper:
          file: "models.py"
          inherits: "SimpleChatModel (LangChain)"
        LiteLLMEmbeddingWrapper:
          file: "models.py"
          inherits: "Embeddings (LangChain)"
        LocalSentenceTransformerWrapper:
          file: "models.py"
          inherits: "Embeddings (LangChain)"
      helper_classes:
        History:
          file: "python/helpers/history.py"
          inherits: "Record (ABC)"
          sub_types: ["Message", "Topic", "Bulk"]
        Memory:
          file: "python/helpers/memory.py"
          areas: ["MAIN", "FRAGMENTS", "SOLUTIONS", "INSTRUMENTS"]
        MyFaiss:
          file: "python/helpers/memory.py"
          inherits: "FAISS (LangChain)"
        Tool:
          file: "python/helpers/tool.py"
          inherits: "ABC"
          key_method: "execute() -> Response"
        Response:
          file: "python/helpers/tool.py"
          inherits: "@dataclass"
          fields: ["message", "break_loop", "additional"]
        Extension:
          file: "python/helpers/extension.py"
          inherits: "ABC"
          key_method: "execute(**kwargs)"
        MCPTool:
          file: "python/helpers/mcp_handler.py"
          inherits: "Tool"
        MCPConfig:
          file: "python/helpers/mcp_handler.py"
          inherits: "BaseModel (Pydantic)"
        TaskState:
          file: "python/helpers/task_scheduler.py"
          inherits: "str, Enum"
          values: ["IDLE", "RUNNING", "DISABLED", "ERROR"]
        TaskType:
          file: "python/helpers/task_scheduler.py"
          inherits: "str, Enum"
          values: ["AD_HOC", "SCHEDULED", "PLANNED"]
        StreamingSecretsFilter:
          file: "python/helpers/secrets.py"
          description: "Stateful streaming filter that masks secrets on-the-fly"

  σ₁.₅_function_topology:
    description: "Key function signatures"
    content:
      agent_core:
        - "async Agent.monologue() -> str"
        - "async Agent.prepare_prompt(loop_data) -> list[BaseMessage]"
        - "async Agent.process_tools(msg) -> str|None"
        - "async Agent.call_chat_model(messages, response_callback, reasoning_callback) -> tuple[str,str]"
        - "async Agent.call_extensions(extension_point, **kwargs)"
        - "Agent.hist_add_ai_response(message)"
        - "Agent.hist_add_tool_result(tool_name, tool_result, **kwargs)"
        - "Agent.read_prompt(file, **kwargs) -> str"
        - "Agent.parse_prompt(_prompt_file, **kwargs) -> str"
      context:
        - "AgentContext.__init__(config, id, name, agent0, ...)"
        - "AgentContext.get(id) -> AgentContext"
        - "AgentContext.current() -> AgentContext"
        - "async AgentContext._process_chain(agent, msg, user)"
        - "AgentContext.communicate(msg, broadcast_level)"
      extensions:
        - "async call_extensions(extension_point, agent, **kwargs)"
      memory:
        - "Memory.search(agent, query, count, threshold, filter, area)"
        - "Memory.save(agent, text, metadata, area)"
        - "Memory.delete(agent, ids, area)"
      initialization:
        - "initialize_agent(settings) -> AgentConfig"

  σ₁.₆_data_structures:
    description: "Data models, schemas, dataclasses"
    content:
      dataclasses:
        - "AgentConfig: Agent configuration bundle"
        - "UserMessage: message + attachments + system_message"
        - "Response: message + break_loop + additional"
        - "ConsolidationConfig: memory consolidation settings"
        - "ConsolidationResult: consolidation analysis result"
        - "Skill: name, description, path, triggers, content, metadata"
      typed_dicts:
        - "Settings: Comprehensive TypedDict with all framework settings"
        - "BasicProjectData: title, description, instructions, color, git_url, memory, file_structure"
        - "FileStructureInjectionSettings: enabled, max_depth, max_files, max_folders, gitignore"
        - "RawMessage: raw_content + preview"
        - "OutputMessage: ai + content"
      enums:
        - "AgentContextType: USER, TASK, BACKGROUND"
        - "ModelType: CHAT, EMBEDDING"
        - "Memory.Area: MAIN, FRAGMENTS, SOLUTIONS, INSTRUMENTS"
        - "TaskState: IDLE, RUNNING, DISABLED, ERROR"
        - "TaskType: AD_HOC, SCHEDULED, PLANNED"
        - "ConsolidationAction: MERGE, REPLACE, KEEP_SEPARATE, UPDATE, SKIP"

