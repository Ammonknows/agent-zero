      server: "Flask + Starlette via uvicorn"
      base_url: "http://localhost:9000"
      authentication:
        - "X-API-Key header for API access"
        - "CSRF tokens for web UI"
        - "Session cookies"
      endpoint_groups:
        chat_management:
          - "POST /api/chat/create"
          - "GET /api/chat/load"
          - "POST /api/chat/reset"
          - "DELETE /api/chat/remove"
          - "GET /api/chat/export"
        messaging:
          - "POST /api/message"
          - "POST /api/message/async"
          - "GET /api/message/queue/send"
          - "DELETE /api/message/queue/remove"
        agents:
          - "GET /api/agents"
          - "POST /api/subagents"
        settings:
          - "GET /api/settings"
          - "POST /api/settings/set"
        knowledge:
          - "POST /api/knowledge/reindex"
          - "GET /api/knowledge/path"
          - "POST /api/import/knowledge"
        scheduling:
          - "POST /api/scheduler/task/create"
          - "DELETE /api/scheduler/task/delete"
          - "POST /api/scheduler/task/run"
          - "POST /api/scheduler/task/update"
          - "GET /api/scheduler/tasks/list"
          - "POST /api/scheduler/tick"
        files:
          - "GET /api/files"
          - "POST /api/upload"
          - "GET /api/download"
          - "POST /api/edit"
          - "DELETE /api/delete"
        mcp:
