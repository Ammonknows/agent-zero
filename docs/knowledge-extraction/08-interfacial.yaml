  σ₈.₂_websocket_interface:
    description: "Real-time WebSocket protocol"
    content:
      library: "python-socketio"
      transport: "WebSocket with polling fallback"
      handlers:
        default: "General message routing"
        hello: "Connection handshake"
        state_sync: "State synchronization"
      events:
        - "Agent response streaming"
        - "Log updates"
        - "Progress notifications"
        - "State change events"

  σ₈.₃_mcp_protocol_interface:
    description: "MCP server and client interfaces"
    content:
      server_endpoints:
        - "/mcp/sse: Server-Sent Events transport"
        - "/mcp/http: Streamable HTTP transport"
      client_protocols:
        - "stdio: Local process communication"
        - "SSE: Remote server events"
        - "streamable HTTP: Remote HTTP streaming"
      tool_interface:
        discovery: "ListToolsResult"
        execution: "CallToolResult"

  σ₈.₄_tool_interface:
    description: "Internal tool API"
    content:
      base_class: "Tool in python/helpers/tool.py"
      interface:
        constructor: "Tool(agent, name, method, args, message, loop_data)"
        execute: "async execute(**kwargs) -> Response"
        before_execution: "async before_execution(**kwargs)"
        after_execution: "async after_execution(response, **kwargs)"
      response_model:
        message: "str — tool output"
        break_loop: "bool — signal to end message loop"
        additional: "dict | None — extra metadata"

  σ₈.₅_extension_interface:
    description: "Extension hook API"
    content:
      base_class: "Extension in python/helpers/extension.py"
      interface:
        constructor: "Extension(agent, **kwargs)"
        execute: "async execute(**kwargs) -> Any"
      invocation: "call_extensions(extension_point, agent, **kwargs)"
      kwargs_per_point:
        system_prompt: "system_prompt, loop_data, agent"
        tool_execute_before: "tool, loop_data, agent"
        message_loop_prompts_after: "loop_data, agent"

